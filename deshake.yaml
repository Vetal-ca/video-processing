profiles:
# https://www.perplexity.ai/search/ffmpeg-is-there-a-way-to-fix-a-TQuow1BqR.KG.N91.7loiQ
  shaky1:
    detection_phase: "shakiness=9:accuracy=15"
    processing_phase: "smoothing=30:zoom=0,unsharp=5:5:0.8:3:3:0.4"

  shaky2:
    detection_phase: "shakiness=7:accuracy=15:stepsize=32:mincontrast=0.3:show=0"
    processing_phase: "smoothing=30:zoom=0:optzoom=1:interpol=bicubic"

  shaky3:
    detection_phase: "shakiness=6:accuracy=20:stepsize=16:mincontrast=0.1:show=0"
    processing_phase: "smoothing=15:zoom=1:optzoom=0:interpol=bicubic,unsharp=2:2:0.5:2:2:0.25,vaguedenoiser=threshold=2:method=soft:nsteps=3"

  # Concert 4 -shaky4 - second the best!
  shaky4:
    detection_phase: "shakiness=4:accuracy=15:stepsize=6:mincontrast=0.15:show=0"
    processing_phase: "smoothing=8:zoom=0:optzoom=1:interpol=bicubic:maxshift=40:maxangle=0.1"

  # Concert 5 -shaky5 - the best!
  shaky5:
    detection_phase: "shakiness=7:accuracy=15:stepsize=6:mincontrast=0.25:show=0"
    processing_phase: "smoothing=15:zoom=1:optzoom=0:interpol=bicubic:maxshift=40:maxangle=0.1"

  # Didn't work
  shaky6:
    detection_phase: "shakiness=4:accuracy=10:stepsize=8:mincontrast=0.2:show=0"
    processing_phase: "smoothing=5:zoom=0:optzoom=0:interpol=bicubic:maxshift=20:maxangle=0.1"
